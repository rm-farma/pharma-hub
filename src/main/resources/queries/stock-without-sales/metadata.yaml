key: stock-without-sales
version: "2.0.0"
description: "Produtos em estoque que nunca tiveram venda registrada — consome a table function get_stock_without_sales do BigQuery"
endpoint: "/queries/stock-without-sales/execute"
tags:
  - estoque
  - sem-venda
params:
  - name: cnpj
    type: STRING
    required: true
    description: "CNPJ da loja"
pagination:
  defaultPageSize: 20
  maxPageSize: 100
  allowUnpaged: true
  maxUnpagedRows: 5000
timeoutMs: 30000
dtoClassName: "com.rmfarma.pharmahub.api.dto.response.queries.StockWithoutSalesDTO"
mapperClassName: "com.rmfarma.pharmahub.infrastructure.mapper.queries.StockWithoutSalesMapper"
