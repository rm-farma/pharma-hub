key: idle-stock
version: "2.0.0"
description: "Estoque parado (produtos em estoque sem vendas) com resumo agregado — consome a table function get_idle_stock do BigQuery"
endpoint: "/queries/idle-stock/execute"
tags:
  - estoque
  - parado
  - sem-venda
params:
  - name: cnpj
    type: STRING
    required: true
    description: "CNPJ da loja"
pagination:
  defaultPageSize: 20
  maxPageSize: 100
  allowUnpaged: true
  maxUnpagedRows: 5000
timeoutMs: 30000
dtoClassName: "com.rmfarma.pharmahub.api.dto.response.queries.IdleStockDTO"
mapperClassName: "com.rmfarma.pharmahub.infrastructure.mapper.queries.IdleStockMapper"
