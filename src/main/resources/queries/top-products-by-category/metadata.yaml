key: top-products-by-category
version: "1.0.0"
description: "Produtos mais vendidos de uma categoria no período — consome a table function get_top_products_by_category do BigQuery"
endpoint: "/queries/top-products-by-category/execute"
tags:
  - vendas
  - produtos
  - categoria
  - ranking
params:
  - name: cnpj
    type: STRING
    required: true
    description: "CNPJ da loja"
  - name: categoria
    type: STRING
    required: true
    description: "Categoria do produto (não diferencia maiúsculas de minúsculas)"
  - name: startDate
    type: DATE
    required: true
    description: "Data início do período"
  - name: endDate
    type: DATE
    required: true
    description: "Data fim do período"
pagination:
  defaultPageSize: 20
  maxPageSize: 100
  allowUnpaged: true
  maxUnpagedRows: 1000
timeoutMs: 30000
dtoClassName: "com.rmfarma.pharmahub.api.dto.response.queries.TopProductByCategoryDTO"
mapperClassName: "com.rmfarma.pharmahub.infrastructure.mapper.queries.TopProductByCategoryMapper"
