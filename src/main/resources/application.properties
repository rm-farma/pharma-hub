# ===== Pharma Hub - Configuração Geral =====
# Estas configs se aplicam a TODOS os perfis (dev e prod).
# Configs específicas por ambiente ficam em:
#   application-dev.properties  -> dev local (quarkus:dev)
#   application-prod.properties -> Cloud Run (QUARKUS_PROFILE=prod)

quarkus.http.port=8080

# Health / Metrics paths
quarkus.smallrye-health.root-path=/q/health
quarkus.micrometer.export.prometheus.path=/q/metrics

# Paginação global
queryhub.default-page-size=20
queryhub.max-page-size=100
queryhub.default-timeout-ms=30000

# Datasource - tipo definido globalmente, URL/credenciais por perfil
quarkus.datasource.db-kind=postgresql

# TENTATIVA REVERTIDA (2026-08-07): quarkus.class-loading.parent-first-artifacts
# pra resolver ClassNotFoundException do Cloud SQL Connector no quarkus:dev.
# Forçar com.google.api:gax parent-first quebrou a extensão
# quarkus-google-cloud-secret-manager (conflito de versão com o gax que ela
# já usa - NoClassDefFoundError em com.google.cloud.ServiceOptions). O jar
# empacotado (java -jar, usado em produção/Cloud Run) NÃO tem esse problema -
# confirmado via teste manual. Decisão: por ora, testar mudanças que tocam
# o banco via jar empacotado (mvn package + java -jar) em vez de quarkus:dev.
# Ver .planning/codebase/CONCERNS.md se algum dia formos revisitar isso via
# alinhamento de versões no dependencyManagement.

# API Keys - necessário no arquivo base para o @ConfigMapping funcionar no boot.
#
# ATENÇÃO: chave única e fixa, compartilhada entre dev e prod (decisão
# consciente de 2026-08-07 - ver README > Pontos de atenção conhecidos).
# application-prod.properties NÃO sobrescreve mais esses valores.
#
# Uma cópia deste valor também está salva no GCP Secret Manager como
# "pharmahub_shared_api_key" (nos projetos rmfarma-dev e rmfarma) -
# mas só como cofre de referência/distribuição pra quem for consumir
# a API. A aplicação NÃO lê do Secret Manager em runtime.
#
# Pra rotacionar: trocar o valor AQUI (e recompilar/redeployar) e só
# depois atualizar a cópia no Secret Manager - editar só o Secret
# Manager não muda nada, a chave antiga continua valendo até o deploy.
queryhub.security.api-keys.dev-client=d572765238d508028f78d576f0597ccabe0a78958a4ebc02
queryhub.security.api-keys.test-client=test-api-key-456
