# ===== Pharma Hub - Configuracao Geral =====
# Estas configs se aplicam a TODOS os perfis (dev e prod).
# Configs especificas por ambiente ficam em:
#   application-dev.properties  -> dev local (quarkus:dev)
#   application-prod.properties -> Cloud Run (QUARKUS_PROFILE=prod)

quarkus.http.port=8080

# Health / Metrics paths
quarkus.smallrye-health.root-path=/q/health
quarkus.micrometer.export.prometheus.path=/q/metrics

# Paginacao global
queryhub.default-page-size=20
queryhub.max-page-size=100
queryhub.default-timeout-ms=30000

# Datasource - tipo definido globalmente, URL/credenciais por perfil
quarkus.datasource.db-kind=postgresql

# API Keys - necessario no arquivo base para o @ConfigMapping funcionar no boot.
# Em prod, sobrescritas pelo application-prod.properties com env vars do Secret Manager.
queryhub.security.api-keys.dev-client=dev-api-key-123
queryhub.security.api-keys.test-client=test-api-key-456


