# ===== Pharma Hub - Configuracao Geral =====
# Estas configs se aplicam a TODOS os perfis (dev e prod).
# Configs especificas por ambiente ficam em:
#   application-dev.properties  -> dev local (quarkus:dev)
#   application-prod.properties -> Cloud Run (QUARKUS_PROFILE=prod)

quarkus.http.port=8080

# Health / Metrics paths
quarkus.smallrye-health.root-path=/q/health
quarkus.micrometer.export.prometheus.path=/q/metrics

# Paginacao global
queryhub.default-page-size=20
queryhub.max-page-size=100
queryhub.default-timeout-ms=30000

# Datasource - tipo definido globalmente, URL/credenciais por perfil
quarkus.datasource.db-kind=postgresql

# TENTATIVA REVERTIDA (2026-08-07): quarkus.class-loading.parent-first-artifacts
# pra resolver ClassNotFoundException do Cloud SQL Connector no quarkus:dev.
# Forcar com.google.api:gax parent-first quebrou a extensao
# quarkus-google-cloud-secret-manager (conflito de versao com o gax que ela
# ja usa - NoClassDefFoundError em com.google.cloud.ServiceOptions). O jar
# empacotado (java -jar, usado em producao/Cloud Run) NAO tem esse problema -
# confirmado via teste manual. Decisao: por ora, testar mudancas que tocam
# o banco via jar empacotado (mvn package + java -jar) em vez de quarkus:dev.
# Ver .planning/codebase/CONCERNS.md se algum dia formos revisitar isso via
# alinhamento de versoes no dependencyManagement.

# API Keys - necessario no arquivo base para o @ConfigMapping funcionar no boot.
#
# ATENCAO: chave unica e fixa, compartilhada entre dev e prod (decisao
# consciente de 2026-08-07 - ver README > Pontos de atencao conhecidos).
# application-prod.properties NAO sobrescreve mais esses valores.
#
# Uma copia deste valor tambem esta salva no GCP Secret Manager como
# "pharmahub_shared_api_key" (nos projetos rmfarma-dev e rmfarma) -
# mas so como cofre de referencia/distribuicao pra quem for consumir
# a API. A aplicacao NAO le do Secret Manager em runtime.
#
# Pra rotacionar: trocar o valor AQUI (e recompilar/redeployar) e so
# depois atualizar a copia no Secret Manager - editar so o Secret
# Manager nao muda nada, a chave antiga continua valendo ate o deploy.
queryhub.security.api-keys.dev-client=d572765238d508028f78d576f0597ccabe0a78958a4ebc02
queryhub.security.api-keys.test-client=test-api-key-456


