# ===== Pharma Hub - Dev Profile =====
# Para rodar localmente:
#   1. gcloud auth application-default login
#   2. ./mvnw quarkus:dev
#
# O perfil "dev" já sobe automaticamente com quarkus:dev.
# As credenciais do banco são buscadas diretamente do GCP Secret Manager.

# -----------------------------------------------
# GCP Secret Manager (autenticação via gcloud auth login)
# -----------------------------------------------
quarkus.google.cloud.project-id=rmfarma-dev

# -----------------------------------------------
# Banco de Dados (valores vêm do Secret Manager automaticamente)
# -----------------------------------------------
quarkus.datasource.jdbc.url=${sm//gpt-db-host}
quarkus.datasource.username=${sm//gpt-db-user}
quarkus.datasource.password=${sm//gpt-db-password}
quarkus.datasource.jdbc.max-size=5
quarkus.datasource.jdbc.min-size=1

# -----------------------------------------------
# Logging (legível no terminal, sem JSON)
# -----------------------------------------------
quarkus.log.level=INFO
quarkus.log.console.json=false
quarkus.log.console.format=%d{HH:mm:ss,SSS} %-5p [%c{3.}] (%t) %s%e%n
quarkus.log.category."com.rmfarma".level=DEBUG

# -----------------------------------------------
# API Keys (hardcoded apenas em dev local)
# Em prod, vêm do Secret Manager via Cloud Build.
# -----------------------------------------------
queryhub.security.api-keys.dev-client=dev-api-key-123
queryhub.security.api-keys.test-client=test-api-key-456

# -----------------------------------------------
# Swagger UI + OpenAPI (apenas dev)
# Acesse: http://localhost:8080/q/swagger-ui
# Spec:   http://localhost:8080/q/openapi
# -----------------------------------------------
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui
quarkus.swagger-ui.theme=flattop
quarkus.swagger-ui.title=Pharma Hub API
quarkus.swagger-ui.footer=Grupo Hiper Saude — Plataforma de Dados
quarkus.swagger-ui.deep-linking=true
quarkus.swagger-ui.display-operation-id=false
quarkus.swagger-ui.display-request-duration=true
quarkus.swagger-ui.filter=true
quarkus.swagger-ui.with-credentials=false
quarkus.smallrye-openapi.info-title=Pharma Hub API
quarkus.smallrye-openapi.info-version=1.0.0
quarkus.smallrye-openapi.info-description=Repositorio centralizado de queries SQL analiticas expostas via REST. Todas as requisicoes (exceto /health) exigem o header X-API-Key. Use a chave dev-api-key-123 para testar em desenvolvimento.
quarkus.smallrye-openapi.info-contact-name=Grupo Hiper Saude — Plataforma
quarkus.smallrye-openapi.info-contact-email=plataforma@rmfarma.com.br
quarkus.smallrye-openapi.security-scheme=apiKey
quarkus.smallrye-openapi.security-scheme-name=ApiKeyAuth
quarkus.smallrye-openapi.security-scheme-description=Chave de API enviada no header X-API-Key. Em desenvolvimento use dev-api-key-123
quarkus.smallrye-openapi.api-key-parameter-name=X-API-Key
quarkus.smallrye-openapi.api-key-parameter-in=header

