# ===== Pharma Hub - Nonprod Profile =====
# Ativado em Cloud Run (projeto rmfarma-dev) via: QUARKUS_PROFILE=nonprod
# Nome alinhado com o pipeline cloudbuild-nonprod.yaml.
#
# É basicamente o perfil prod, com uma única diferença proposital:
# Swagger UI + OpenAPI ficam LIGADOS aqui, pra dar pra explorar/testar a API
# nesse ambiente sem precisar rodar local. Em rmfarma (prod de verdade)
# continua tudo desligado via application-prod.properties.
#
# Todas as variáveis sensíveis vêm injetadas pelo Cloud Build como env vars,
# vindas do Secret Manager (--set-secrets) ou --set-env-vars.

# -----------------------------------------------
# Banco de Dados
# As env vars DATABASE_URL, DATABASE_USER, DATABASE_PASSWORD
# são injetadas pelo Cloud Build via --set-secrets do Secret Manager.
# -----------------------------------------------
quarkus.datasource.jdbc.url=${DATABASE_URL}
quarkus.datasource.username=${DATABASE_USER}
quarkus.datasource.password=${DATABASE_PASSWORD}
quarkus.datasource.jdbc.max-size=5
quarkus.datasource.jdbc.min-size=1

# -----------------------------------------------
# Logging (JSON para Cloud Logging / Stackdriver)
# -----------------------------------------------
quarkus.log.level=${LOG_LEVEL:DEBUG}
quarkus.log.console.json=${LOG_JSON:true}
quarkus.log.category."com.rmfarma".level=${LOG_LEVEL:DEBUG}

# -----------------------------------------------
# Swagger UI + OpenAPI HABILITADOS (diferença em relação ao prod)
# Acesse: https://<url-do-cloud-run>/q/swagger-ui
#
# ATENCAO: a chave de API real NAO fica escrita na descricao aqui
# (ver OpenApiConfig.java - texto generico "peça ao time de plataforma").
# Esse ambiente hoje está publicamente acessível sem IAM do Google
# (--no-allow-unauthenticated pode ter sido sobrescrito manualmente),
# então nunca hardcode a chave de verdade em nenhum texto exposto aqui.
# -----------------------------------------------
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui
quarkus.smallrye-openapi.enable=true
