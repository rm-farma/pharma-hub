# ===== Pharma Hub - Prod Profile =====
# Este perfil é ativado em Cloud Run via: QUARKUS_PROFILE=prod
# Todas as variáveis sensíveis vêm injetadas pelo Cloud Build como env vars,
# vindas do Secret Manager (--set-secrets) ou --set-env-vars.

# -----------------------------------------------
# Logging (JSON para Cloud Logging / Stackdriver)
# -----------------------------------------------
quarkus.log.level=${LOG_LEVEL:INFO}
quarkus.log.console.json=${LOG_JSON:true}
quarkus.log.category."com.rmfarma".level=${LOG_LEVEL:INFO}

# -----------------------------------------------
# Swagger UI + OpenAPI HABILITADOS em prod (decisão 2026-08-25).
#
# Cloud Run já exige --no-allow-unauthenticated (IAM run.invoker) para
# alcançar o serviço, mesma proteção de rede que o nonprod já tem — e
# todas as queries são SELECT (não existe caminho de escrita nas table
# functions). Habilitado para permitir validar em prod real as queries
# recém-migradas para BigQuery.
# Acesse: https://<url-do-cloud-run>/q/swagger-ui
# -----------------------------------------------
quarkus.swagger-ui.always-include=true
quarkus.swagger-ui.path=/q/swagger-ui
quarkus.smallrye-openapi.enable=true

