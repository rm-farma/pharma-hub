# ===== Pharma Hub - Prod Profile =====
# Este perfil é ativado em Cloud Run via: QUARKUS_PROFILE=prod
# Todas as variáveis sensíveis vêm injetadas pelo Cloud Build como env vars,
# vindas do Secret Manager (--set-secrets) ou --set-env-vars.

# -----------------------------------------------
# Banco de Dados
# As env vars DATABASE_URL, DATABASE_USER, DATABASE_PASSWORD
# são injetadas pelo Cloud Build via --set-secrets do Secret Manager.
# -----------------------------------------------
quarkus.datasource.jdbc.url=${DATABASE_URL}
quarkus.datasource.username=${DATABASE_USER}
quarkus.datasource.password=${DATABASE_PASSWORD}
quarkus.datasource.jdbc.max-size=10
quarkus.datasource.jdbc.min-size=2

# -----------------------------------------------
# Logging (JSON para Cloud Logging / Stackdriver)
# -----------------------------------------------
quarkus.log.level=${LOG_LEVEL:INFO}
quarkus.log.console.json=${LOG_JSON:true}
quarkus.log.category."com.rmfarma".level=${LOG_LEVEL:INFO}

# -----------------------------------------------
# API Keys dos clientes
# Injetadas via --set-secrets no Cloud Build.
# Os nomes das env vars devem bater com os do cloudbuild-*.yaml.
# -----------------------------------------------
queryhub.security.api-keys.pharma-app=${API_KEY_PHARMA_APP}
queryhub.security.api-keys.admin-dashboard=${API_KEY_ADMIN_DASHBOARD}

# -----------------------------------------------
# Swagger UI + OpenAPI desabilitados em prod
# -----------------------------------------------
quarkus.swagger-ui.always-include=false
quarkus.smallrye-openapi.enable=false

